<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XLocalizador — Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --primary: #0F7D3F; --primary-dark: #0B5C2E; --ink: #1A1A1A; --bg: #FAFAFA; --muted: #5B6B66; --border: #E6ECE9; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); padding: 32px 16px 60px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 160px; }
  .card.dark { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); border: none; }
  .card svg { max-width: 100%; height: auto; }
  .label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .card.dark .label { color: rgba(255,255,255,0.8); }
  .icon-sizes { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .icon-sizes div { text-align: center; }
  .icon-sizes span { display: block; font-size: 11px; color: var(--muted); margin-top: 6px; }
  section { margin-bottom: 36px; }
  h2 { font-size: 15px; margin-bottom: 12px; color: var(--primary-dark); }
  .wordmark { font-family: 'Poppins', 'Segoe UI', -apple-system, sans-serif; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🎨 XLocalizador — Marca</h1>
    <div class="sub">Conceito: pin de localização com "X" marcando o lugar dentro — une a identidade da marca (X) com a função do produto (localizar)</div>

    <section>
      <h2>Logotipo horizontal</h2>
      <div class="row">
        <div class="card">
          <svg viewBox="0 0 480 120" width="320">
            <defs>
              <linearGradient id="g1" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#14915A"/><stop offset="1" stop-color="#0B5C2E"/>
              </linearGradient>
            </defs>
            <rect width="120" height="120" rx="28" fill="url(#g1)"/>
            <g transform="translate(12,12) scale(4)">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#FFFFFF"/>
              <g stroke="#0B5C2E" stroke-width="1.7" stroke-linecap="round">
                <line x1="9.9" y1="6.9" x2="14.1" y2="11.1"/><line x1="14.1" y1="6.9" x2="9.9" y2="11.1"/>
              </g>
            </g>
            <text x="148" y="77" class="wordmark" letter-spacing="-1">
              <tspan font-size="56" font-weight="800" fill="#0F7D3F">X</tspan><tspan font-size="46" font-weight="600" fill="#1A1A1A">Localizador</tspan>
            </text>
          </svg>
          <div class="label">Fundo claro</div>
        </div>
        <div class="card dark">
          <svg viewBox="0 0 480 120" width="320">
            <defs>
              <linearGradient id="g2" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#14915A"/><stop offset="1" stop-color="#0B5C2E"/>
              </linearGradient>
            </defs>
            <rect width="120" height="120" rx="28" fill="url(#g2)"/>
            <g transform="translate(12,12) scale(4)">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#FFFFFF"/>
              <g stroke="#0B5C2E" stroke-width="1.7" stroke-linecap="round">
                <line x1="9.9" y1="6.9" x2="14.1" y2="11.1"/><line x1="14.1" y1="6.9" x2="9.9" y2="11.1"/>
              </g>
            </g>
            <text x="148" y="77" class="wordmark" letter-spacing="-1">
              <tspan font-size="56" font-weight="800" fill="#FFFFFF">X</tspan><tspan font-size="46" font-weight="600" fill="#EAF6EF">Localizador</tspan>
            </text>
          </svg>
          <div class="label">Fundo escuro / verde</div>
        </div>
      </div>
    </section>

    <section>
      <h2>Ícone / favicon</h2>
      <div class="card">
        <div class="icon-sizes">
          <div>
            <svg viewBox="0 0 120 120" width="80" height="80">
              <defs><linearGradient id="g3" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#14915A"/><stop offset="1" stop-color="#0B5C2E"/></linearGradient></defs>
              <rect width="120" height="120" rx="28" fill="url(#g3)"/>
              <g transform="translate(12,12) scale(4)">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#FFFFFF"/>
                <g stroke="#0B5C2E" stroke-width="1.7" stroke-linecap="round"><line x1="9.9" y1="6.9" x2="14.1" y2="11.1"/><line x1="14.1" y1="6.9" x2="9.9" y2="11.1"/></g>
              </g>
            </svg>
            <span>80px</span>
          </div>
          <div>
            <svg viewBox="0 0 120 120" width="48" height="48">
              <defs><linearGradient id="g4" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#14915A"/><stop offset="1" stop-color="#0B5C2E"/></linearGradient></defs>
              <rect width="120" height="120" rx="28" fill="url(#g4)"/>
              <g transform="translate(12,12) scale(4)">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#FFFFFF"/>
                <g stroke="#0B5C2E" stroke-width="1.7" stroke-linecap="round"><line x1="9.9" y1="6.9" x2="14.1" y2="11.1"/><line x1="14.1" y1="6.9" x2="9.9" y2="11.1"/></g>
              </g>
            </svg>
            <span>48px</span>
          </div>
          <div>
            <svg viewBox="0 0 120 120" width="32" height="32">
              <defs><linearGradient id="g5" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#14915A"/><stop offset="1" stop-color="#0B5C2E"/></linearGradient></defs>
              <rect width="120" height="120" rx="28" fill="url(#g5)"/>
              <g transform="translate(12,12) scale(4)">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#FFFFFF"/>
                <g stroke="#0B5C2E" stroke-width="1.7" stroke-linecap="round"><line x1="9.9" y1="6.9" x2="14.1" y2="11.1"/><line x1="14.1" y1="6.9" x2="9.9" y2="11.1"/></g>
              </g>
            </svg>
            <span>32px</span>
          </div>
          <div>
            <svg viewBox="0 0 120 120" width="16" height="16">
              <defs><linearGradient id="g6" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#14915A"/><stop offset="1" stop-color="#0B5C2E"/></linearGradient></defs>
              <rect width="120" height="120" rx="28" fill="url(#g6)"/>
              <g transform="translate(12,12) scale(4)">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#FFFFFF"/>
                <g stroke="#0B5C2E" stroke-width="1.7" stroke-linecap="round"><line x1="9.9" y1="6.9" x2="14.1" y2="11.1"/><line x1="14.1" y1="6.9" x2="9.9" y2="11.1"/></g>
              </g>
            </svg>
            <span>16px</span>
          </div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
